name: Agent Factory Daily Run

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-factory:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic playwright

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Agent Factory
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python factory.py

      - name: Run Traffic Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python traffic_agent.py

      - name: Run Auto Lister
        env:
          GUMROAD_EMAIL: ${{ secrets.GUMROAD_EMAIL }}
          GUMROAD_PASSWORD: ${{ secrets.GUMROAD_PASSWORD }}
          PAYHIP_EMAIL: ${{ secrets.PAYHIP_EMAIL }}
          PAYHIP_PASSWORD: ${{ secrets.PAYHIP_PASSWORD }}
        run: python lister.py

      - name: Commit and push all outputs
        run: |
          git config --global user.name "Agent Factory Bot"
          git config --global user.email "factory@agentfactory.bot"
          git add outputs/products.json DAILY_LISTING.md TRAFFIC_POSTS.md
          git diff --staged --quiet || git commit -m "Factory run: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
